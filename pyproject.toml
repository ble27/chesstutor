[project]
name = "chesstutor"
version = "0.1.0"
description = "Independent review of completed public chess games"
license = "GPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "rq>=2,<3",
  "chess>=1.11,<2",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "build>=1.2,<2",
  "hatchling==1.27.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires real PostgreSQL and Redis"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["services"]
plugins = ["pydantic.mypy"]
