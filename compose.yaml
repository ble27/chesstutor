name: chesstutor
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: chesstutor
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [default, backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chesstutor"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.2.11-alpine@sha256:1a34bdba051ecd8a58ec8a3cc460acef697a1605e918149cc53d920673c1a0a7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis-data:/data"]
    networks: [default, backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    build: {context: ., target: application}
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment:
      CHESS_DATABASE_URL: postgresql://chess:local-development@postgres:5432/chesstutor
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., target: application}
    environment:
      CHESS_DATABASE_URL: postgresql://chess:local-development@postgres:5432/chesstutor
      CHESS_PUBAPI_USER_AGENT: ${CHESS_PUBAPI_USER_AGENT:-}
      CHESS_ELEVENLABS_API_KEY: ${CHESS_ELEVENLABS_API_KEY:-}
      CHESS_REDIS_URL: redis://redis:6379/0
      CHESS_ENGINE_PLATFORM: linux-x86_64
      CHESS_SESSION_SECRET: ${CHESS_SESSION_SECRET:-local-development-session-key-change-before-hosting}
      CHESS_ANALYSIS_IP_JOBS_PER_HOUR: ${CHESS_ANALYSIS_IP_JOBS_PER_HOUR:-20}
    ports: ["127.0.0.1:8000:8000"]
    networks: [default, backend]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20
  worker:
    platform: linux/amd64
    build: {context: ., target: engine-worker}
    command: [".venv/bin/python", "-m", "services.worker.main"]
    environment:
      CHESS_REDIS_URL: redis://redis:6379/0
      CHESS_DATABASE_URL: postgresql://chess:local-development@postgres:5432/chesstutor
      CHESS_ENGINE_PLATFORM: linux-x86_64
    networks: [backend]
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-m", "services.worker.health"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 1
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 6s
      retries: 20
networks:
  backend:
    internal: true
volumes:
  postgres-data:
  redis-data:
